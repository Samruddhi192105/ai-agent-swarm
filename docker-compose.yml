services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-agentswarm}
      POSTGRES_USER: ${DB_USER:-agentswarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentswarm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-agentswarm}
      DB_USER: ${DB_USER:-agentswarm}
      DB_PASSWORD: ${DB_PASSWORD:-agentswarm}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "8080:8080"
    # Lets the backend talk to the host Docker daemon to spin up sandbox containers.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
